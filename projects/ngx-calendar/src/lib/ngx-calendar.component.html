<div>
  {{selectedYear() }} - {{selectedMonth()}}
  <div class="buttons">
    <button (click)="previousMonth()">Previous</button>
    <button (click)="nextMonth()">Next</button>
  </div>
  <div class="calendar">
    <div class="calendar-header">
      @for (dayHeader of dayHeaders; track $index) {
        <div class="day">
          {{ dayHeader }}
        </div>
      }
    </div>
    <div class="calendar-body">
      @for (day of daysWithEvents(); track $index) {
        <div class="day">
          <div class="day-marker">{{ day.date | date : 'd' }}</div>
          <div class="day-events">
            @for(event of day.events; track $index) {
              <span>{{ event.title }}</span>
            }
          </div>
          <div class="day-content"></div>
        </div>
      }
    </div>
  </div>
</div>
